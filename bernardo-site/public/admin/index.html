<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración — Bernardo Combeau</title>
  </head>
  <body>
    <!-- Vercel en modo servidor no sirve bien archivos .yml sueltos en public/, así que
         la configuración va incrustada acá directo como objeto JS en vez de config.yml. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "rvalleespin/bernardo-combeau", // ⚠️ cambiar si el repo en GitHub queda con otro nombre
            branch: "main",
            base_url: "https://bernardo-combeau.vercel.app",
            auth_endpoint: "api/auth",
          },
          publish_mode: "simple",
          site_url: "https://bernardo-combeau.vercel.app",
          media_folder: "bernardo-site/public/uploads",
          public_folder: "/uploads",
          collections: [
            {
              name: "home",
              label: "Home",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/home.json",
                  label: "Portada",
                  name: "home",
                  preview_path: "",
                  fields: [
                    { label: "Foto de portada (hero)", name: "fotoHero", widget: "image", hint: "Foto horizontal, buena resolución (mínimo ~2000px de ancho)" },
                    { label: "Frase del hero", name: "fraseHero", widget: "text", hint: "Usa una línea en blanco para forzar el salto de línea" },
                    { label: "Crédito (esquina del hero)", name: "creditoHero", widget: "string" },
                  ],
                },
              ],
            },
            {
              name: "perfil",
              label: "📷 Foto de perfil",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/perfil.json",
                  label: "Foto de perfil",
                  name: "perfil",
                  preview_path: "sobre-mi",
                  fields: [
                    { label: "Tu foto (cámbiala cuando quieras)", name: "foto", widget: "image", required: false },
                  ],
                },
              ],
            },
            {
              name: "sobremi",
              label: "Sobre mí (texto)",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/sobremi.json",
                  label: "Sobre mí",
                  name: "sobremi",
                  preview_path: "sobre-mi",
                  fields: [
                    { label: "Párrafo 1", name: "parrafo1", widget: "text" },
                    { label: "Párrafo 2", name: "parrafo2", widget: "text" },
                  ],
                },
              ],
            },
            {
              name: "estudio",
              label: "Estudio",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/estudio.json",
                  label: "Estudio",
                  name: "estudio",
                  preview_path: "estudio",
                  fields: [
                    { label: "Dirección / barrio exacto", name: "direccion", widget: "string", required: false },
                    {
                      label: "Fotos del estudio (hasta 4)",
                      name: "fotos",
                      widget: "list",
                      field: { label: "Foto", name: "src", widget: "image" },
                      max: 4,
                    },
                  ],
                },
              ],
            },
            {
              name: "servicios",
              label: "Servicios",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/servicios.json",
                  label: "Lista de servicios",
                  name: "servicios",
                  preview_path: "servicios",
                  fields: [
                    {
                      label: "Servicios",
                      name: "servicios",
                      widget: "list",
                      fields: [
                        { label: "Título", name: "titulo", widget: "string" },
                        { label: "Descripción", name: "descripcion", widget: "text" },
                        { label: "Precio (o texto del botón)", name: "precio", widget: "string" },
                        { label: "¿Es un botón de contacto en vez de un precio?", name: "esCta", widget: "boolean", default: false },
                      ],
                    },
                  ],
                },
              ],
            },
            {
              name: "contacto",
              label: "Contacto",
              editor: { preview: false },
              files: [
                {
                  file: "bernardo-site/src/data/contacto.json",
                  label: "Datos de contacto",
                  name: "contacto",
                  preview_path: "contacto",
                  fields: [
                    { label: "Texto de introducción", name: "intro", widget: "text" },
                    { label: "WhatsApp (número, ej. 56912345678)", name: "whatsapp", widget: "string", required: false },
                    { label: "Email", name: "email", widget: "string", required: false },
                    { label: "Instagram (usuario, sin @)", name: "instagram", widget: "string", required: false },
                  ],
                },
              ],
            },
            {
              name: "series",
              label: "Series",
              folder: "bernardo-site/src/content/series",
              editor: { preview: false },
              preview_path: "series/{{slug}}",
              create: true,
              slug: "{{slug}}",
              fields: [
                { label: "Título", name: "title", widget: "string" },
                { label: "Año (ej. 2024–2025)", name: "year", widget: "string" },
                { label: "Excerpt (1-2 frases de contexto)", name: "excerpt", widget: "text" },
                { label: "Orden (menor número = aparece primero)", name: "order", widget: "number" },
                {
                  label: "Portada",
                  name: "cover",
                  widget: "object",
                  fields: [
                    { label: "Imagen", name: "src", widget: "image" },
                    { label: "Descripción para lectores de pantalla", name: "alt", widget: "string" },
                    { label: "Crédito", name: "credit", widget: "string", required: false },
                    { label: "Lugar", name: "place", widget: "string", required: false },
                    { label: "Año", name: "year", widget: "string", required: false },
                  ],
                },
                {
                  label: "Fotos de la serie",
                  name: "images",
                  widget: "list",
                  min: 1,
                  max: 10,
                  hint: "Mínimo 1, máximo 10 fotos por serie. Sube fotos verticales u horizontales de buena resolución (mínimo ~1500px de ancho) — evita capturas de pantalla o fotos muy comprimidas.",
                  fields: [
                    { label: "Imagen", name: "src", widget: "image" },
                    { label: "Descripción para lectores de pantalla", name: "alt", widget: "string" },
                    { label: "Crédito", name: "credit", widget: "string", required: false },
                    { label: "Lugar", name: "place", widget: "string", required: false },
                    { label: "Año", name: "year", widget: "string", required: false },
                  ],
                },
                { label: "Texto largo (opcional, va debajo del excerpt)", name: "body", widget: "markdown", required: false },
              ],
            },
            {
              name: "encargos",
              label: "Encargos",
              folder: "bernardo-site/src/content/encargos",
              editor: { preview: false },
              preview_path: "encargos/{{slug}}",
              create: true,
              slug: "{{slug}}",
              fields: [
                { label: "Título", name: "title", widget: "string" },
                { label: "Cliente (si es público)", name: "client", widget: "string", required: false },
                { label: "Año", name: "year", widget: "string" },
                { label: "Excerpt (1-2 frases de contexto)", name: "excerpt", widget: "text" },
                { label: "Orden (menor número = aparece primero)", name: "order", widget: "number" },
                {
                  label: "Portada",
                  name: "cover",
                  widget: "object",
                  fields: [
                    { label: "Imagen", name: "src", widget: "image" },
                    { label: "Descripción para lectores de pantalla", name: "alt", widget: "string" },
                    { label: "Crédito", name: "credit", widget: "string", required: false },
                    { label: "Lugar", name: "place", widget: "string", required: false },
                    { label: "Año", name: "year", widget: "string", required: false },
                  ],
                },
                {
                  label: "Fotos del encargo (hasta 60)",
                  name: "images",
                  widget: "list",
                  max: 60,
                  fields: [
                    { label: "Imagen", name: "src", widget: "image" },
                    { label: "Descripción para lectores de pantalla", name: "alt", widget: "string" },
                    { label: "Crédito", name: "credit", widget: "string", required: false },
                    { label: "Lugar", name: "place", widget: "string", required: false },
                    { label: "Año", name: "year", widget: "string", required: false },
                  ],
                },
                {
                  label: "Publicación externa (si salió publicado en un medio)",
                  name: "publication",
                  widget: "object",
                  required: false,
                  fields: [
                    { label: "Nombre del medio", name: "name", widget: "string" },
                    { label: "URL", name: "url", widget: "string" },
                  ],
                },
                { label: "Texto largo (opcional, va debajo del excerpt)", name: "body", widget: "markdown", required: false },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
