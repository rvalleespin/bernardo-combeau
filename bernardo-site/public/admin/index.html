<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración — Bernardo Combeau</title>
    <style>
      /* Dirección A (revision-panel-admin-bernardo.md, Parte 3) — vestir el chrome
         de Decap con la identidad de Bernardo en vez de su magenta de fábrica.
         El acento sale de un muestreo real de piel en una de sus fotos (beto3.jpg,
         zona de frente, #dcb8b6), llevado a un tono utilizable como acento
         (misma familia de matiz, más saturado/oscuro para que rinda como color
         de UI) — no es un color inventado a ojo.
         Selectors por [class*="..."]: Decap usa Emotion (CSS-in-JS); el hash de
         cada clase cambia entre builds pero el nombre del componente queda
         embebido en el propio className (ej. "css-39fnji-LoginButton-...") y
         ESE nombre sí es estable. Verificado contra el DOM real del panel
         corriendo local, no adivinado. */
      :root {
        --bc-accent: #98433e;
        --bc-paper: #fbfaf8;
        --bc-ink: #111110;
        --bc-line: #e7e4dd;
        --bc-stage: #f0efe9;
      }

      body { background: var(--bc-paper) !important; }

      /* Login: fuera el logo de Decap, wordmark de Bernardo en su lugar */
      [class*="StyledAuthenticationPage"] { background: var(--bc-paper) !important; }
      [class*="DecapLogoIcon"] { display: none !important; }
      [class*="StyledAuthenticationPage"]::before {
        content: "Bernardo Combeau";
        display: block;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 1.5rem;
        font-weight: 500;
        color: var(--bc-ink);
        margin-bottom: 1.6rem;
        letter-spacing: 0.01em;
      }
      [class*="LoginButton"] { background: var(--bc-ink) !important; border-radius: 2px !important; }
      [class*="LoginButton"]:hover { background: var(--bc-accent) !important; }

      /* Sidebar: acento cálido en el ítem activo y en hover (antes azul default) */
      [class*="SidebarNavLink"].sidebar-active { color: var(--bc-accent) !important; border-color: var(--bc-accent) !important; }
      [class*="SidebarNavLink"]:hover { color: var(--bc-accent) !important; }

      /* Header superior: mismo acento en la pestaña activa (Contenido / Medios) */
      [class*="AppHeaderButton"].header-link-active { color: var(--bc-accent) !important; }

      /* Dirección B — jerarquía visual en la sidebar. Decap no soporta agrupar
         colecciones de forma nativa (confirmado) — nada de fingir una feature
         que no existe. Lo que sí es 100% CSS, sin tocar el DOM que Decap genera:
         una línea separadora entre "páginas" (Home..Modelo, todas de un solo
         archivo o set fijo de archivos) y "galerías" (Retratos, Proyectos,
         colecciones donde se crean entradas nuevas). Depende del orden fijo de
         "collections" más abajo — Modelo vuelve a estar adentro (ya no aplica
         la Dirección C), así que el 7º ítem es Retratos. */
      [class*="CollectionContainer"] a[class*="SidebarNavLink"]:nth-of-type(7) {
        margin-top: 1rem !important;
        padding-top: 1rem !important;
        border-top: 1px solid var(--bc-line) !important;
      }

      /* Dirección D — Medios: el fondo tipo "transparencia" (pensado para PNG
         con alfa) detrás de cada miniatura no pinta nada en fotos JPG opacas;
         tono papel/stage del sitio en su lugar. */
      [class*="checkerboard"] { background-image: none !important; background-color: var(--bc-stage) !important; }

      /* Parte 1 #3 del review — el editor de una entrada no se adaptaba a
         celular: el layout de dos columnas (formulario + vista previa) trae
         min-width:800px fijo en Decap y nunca se apilaba. Verificado contra el
         DOM real en viewport de celular: el min-width vive en EditorContainer/
         ToolbarContainer (CSS de Decap, no inline) y la dirección horizontal en
         .SplitPane (inline, pero un !important en hoja de estilos sí le gana a
         un inline sin !important). Debajo de 800px se apila en una columna; el
         "Resizer" (para arrastrar el ancho de cada panel) no tiene función
         apilado, se oculta. .SplitPane/.Pane1/.Pane2 son clases de
         react-split-pane (la librería que usa Decap), no clases propias de
         este archivo — estables mientras Decap no cambie de librería interna. */
      @media (max-width: 800px) {
        [class*="EditorContainer"],
        [class*="ToolbarContainer"] { min-width: 0 !important; width: 100% !important; }
        .SplitPane { flex-direction: column !important; position: relative !important; height: auto !important; }
        .Pane1, .Pane2 { width: 100% !important; max-width: 100% !important; }
        .Resizer { display: none !important; }
        /* La barra superior (volver / estado+publicar / ver+usuario) traía sus 3
           secciones en una sola fila sin wrap — a 390px se cortaban literalmente
           fuera de pantalla (ej. el botón "Eliminar entrada"). Apilarlas. */
        [class*="ToolbarContainer"] { flex-wrap: wrap !important; height: auto !important; }
        [class*="ToolbarSectionBackLink"],
        [class*="ToolbarSectionMain"],
        [class*="ToolbarSectionMeta"] { width: 100% !important; min-width: 0 !important; flex: 1 1 100% !important; }
        /* Los botones flotantes "ver vista previa" / "sincronizar scroll" están
           pensados para la vista dividida de escritorio; apilado no aplican y
           quedaban flotando encima del primer campo del formulario. */
        [class*="EditorToggle"] { display: none !important; }
      }
    </style>

        // Vista previa de "5. Motion / Commercials" (colección Modelo) — a pedido de
        // Ramón, que la vio caer al genérico de Decap (texto plano en negro) y se veía
        // "extraña". Modelo entero no tiene vista previa registrada todavía (gap ya
        // señalado en revision-panel-admin-bernardo.md) — este es solo el archivo de
        // Motion, el resto de Modelo sigue pendiente si se pide.
        // La miniatura sale del thumbnail público de YouTube — mismo mecanismo que
        // gridDeVideos()/parseReel() en src/lib/modelo.js, reescrito acá porque el
        // panel corre en el navegador sin acceso a ese módulo (dos runtimes distintos,
        // sin bundling compartido — mismo patrón que hasRealPublication en otras
        // vistas previas de este archivo).
        function parseReelId(url) {
          if (!url) return null;
          var yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]+)/);
          if (yt) return { tipo: "youtube", id: yt[1] };
          var vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
          if (vimeo) return { tipo: "vimeo", id: vimeo[1] };
          return null;
        }

        function videoTile(v) {
          var parsed = parseReelId(v.url);
          var thumb = parsed && parsed.tipo === "youtube" ? "https://img.youtube.com/vi/" + parsed.id + "/hqdefault.jpg" : null;
          return h(
            "a",
            { key: v.url + v.nombre, className: "commercial-tile", href: v.url, target: "_blank", rel: "noopener" },
            h("div", { className: "thumb" }, thumb ? h("img", { src: thumb, alt: "" }) : null, h("div", { className: "play" })),
            h("p", { className: "nombre" }, v.nombre)
          );
        }

        function videoGrid(titulo, videos) {
          // Mismo filtro que gridDeVideos(): solo entran los que tienen nombre Y un
          // link que de verdad se puede leer como YouTube o Vimeo.
          var real = videos.filter(function (v) {
            return v.nombre && parseReelId(v.url);
          });
          if (!real.length) return null;
          return h("section", { className: "commercials" }, h("h1", {}, titulo), h("div", { className: "commercials-grid" }, real.map(videoTile)));
        }

        // Motion es una galería de fotos (Commercials sigue siendo videos, arriba) —

        // resuelve una imagen todavía sin publicar dentro del panel.
        function photoGrid(titulo, fotos, getAsset) {
          var real = (fotos || []).filter(function (f) {

          if (!real.length) return null;
          return h(

        // Vista previa real de cada ficha de Modelo (a pedido de Bernardo — quería ver su

        function portadaSection(entry, getAsset) {

        function gridBookSection(fotos, getAsset) {

          return h("div", {}, teaser, lista);
        }

        function polaroidsSection(fotos, getAsset) {

        function detailsSection(entry) {
          var d = {
            height: entry.getIn(["data", "height"]),

            eyes: entry.getIn(["data", "eyes"]),
          };
          var groups = [
            [["Height", d.height]],

            ],

        // No incluye email/WhatsApp: viven en la ficha "Contacto" (otra colección),
        // sin acceso desde acá — cada vista previa solo ve los datos de SU propio archivo.
        function bookingSection(entry) {

          return h(

        // registerPreviewTemplate() en una colección de varios archivos (Modelo): confirmado
        // leyendo el propio código fuente de Decap (minificado, en decap-cms.js) que la clave
        // real es el nombre del ARCHIVO individual (p.ej. "modelo_motion"), nunca el de la
        // colección completa ("modelo") — un registro a nivel de colección simplemente no se
        // consulta nunca para una entrada de este tipo. Por eso este mismo componente se
        // registra más abajo bajo los 8 nombres de archivo de Modelo, y decide qué mostrar
        // mirando el SLUG real de la entrada (no la forma de sus campos: "Galería" también
        // tiene un campo llamado "fotos", así que detectar Motion por eso confundía a las dos).
        // Bernardo pidió ver de verdad su trabajo reflejado en el sitio, no solo un aviso —
        // así que las 8 fichas tienen ahora su propia vista previa real, cada una reconstruye
        // SOLO su sección con el CSS de index.astro (ver el porqué en las funciones de arriba).
        var ModeloPreview = createClass({
          render: function () {
            try {
              var entry = this.props.entry;
              var getAsset = this.props.getAsset;
              var slug = entry.get("slug");
              var contenido;
              if (slug === "modelo_portada") {
                contenido = portadaSection(entry, getAsset);
              } else if (slug === "modelo_galeria") {
                contenido = gridBookSection(listField(entry, ["data", "fotos"]), getAsset);
              } else if (slug === "modelo_identity") {
                contenido = identitySection(entry);
              } else if (slug === "modelo_selected_work") {
                contenido = selectedWorkSection(entry, listField(entry, ["data", "trabajos"]), getAsset);
              } else if (slug === "modelo_motion") {
                var motionGrid = photoGrid("Motion", listField(entry, ["data", "fotos"]), getAsset);
                var comercialesGrid = videoGrid("Commercials", listField(entry, ["data", "comerciales"]));
                contenido = motionGrid || comercialesGrid ? h("div", {}, motionGrid, comercialesGrid) : null;
              } else if (slug === "modelo_polaroids") {
                contenido = polaroidsSection(listField(entry, ["data", "fotos"]), getAsset);
              } else if (slug === "modelo_details") {
                contenido = detailsSection(entry);
              } else if (slug === "modelo_booking") {
                contenido = bookingSection(entry);
              } else {
                return h(
                  "div",
                  { style: { padding: "2rem", color: "#84817a", fontSize: ".85rem" } },
                  "Esta sección de Modelo todavía no tiene vista previa en vivo — los cambios se guardan igual, solo no hay cómo verlos acá todavía."
                );
              }
              if (!contenido) {
                return h(
                  "div",
                  { style: { padding: "2rem", color: "#84817a", fontSize: ".85rem" } },
                  "Sin contenido cargado todavía — agrega uno arriba y acá se arma la vista previa real."
                );
              }
              return h(
                "div",
                { className: "modelo-preview" },
                contenido,
                h("p", { className: "volver" }, h("a", { href: "/modelo/" }, "← Model"))
              );
            } catch (e) {
              return h(
                "p",
                { style: { padding: "2rem", fontFamily: "monospace", fontSize: ".8rem" } },
                "Vista previa no disponible en este momento (esto no afecta lo que estás editando ni guardando)."
              );
            }
          },
        });

        CMS.registerPreviewTemplate("home", HomePreview);
        CMS.registerPreviewTemplate("sobremi", SobreMiPreview);
        CMS.registerPreviewTemplate("estudio", EstudioPreview);
        CMS.registerPreviewTemplate("servicios", ServiciosPreview);
        CMS.registerPreviewTemplate("contacto", ContactoPreview);
        CMS.registerPreviewTemplate("retratos", galleryPreview("/retratos", "Retratos"));
        CMS.registerPreviewTemplate("proyectos", galleryPreview("/proyectos", "Proyectos"));
        CMS.registerPreviewTemplate("modelo_portada", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_galeria", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_identity", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_selected_work", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_motion", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_polaroids", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_details", ModeloPreview);
        CMS.registerPreviewTemplate("modelo_booking", ModeloPreview);
      })();

      // Traduce al español los textos propios de Decap (botones, confirmaciones, la
      // librería de medios, etc.) — sin esto, todo lo que no sean nuestras etiquetas de
      // campo queda en inglés ("Delete entry", "Upload"...). Copiado del paquete oficial
      // decap-cms-locales (src/es/index.js) porque su build publicado en npm/unpkg está
      // roto (el bundle UMD no exporta nada) — registrado a mano en vez de cargarlo como

      // Widget de encuadre — a pedido de Ramón (3-sep-2026, sin cobro): que Bernardo
      // pueda marcar dónde va el centro del recorte cuadrado de la portada, en vez de
      // que siempre se recorte centrado y a veces corte cabezas/detalles. Toca o haz
      // clic sobre la foto completa para mover el punto; el recuadro punteado muestra
      // exactamente qué va a quedar visible en el cuadrado.
      // Guarda un string "X% Y%" — el mismo formato que espera `object-position` en
      // CSS, así el sitio y esta vista previa lo consumen directo, sin traducir nada.
      // Solo existe para "cover" (retratos/proyectos): es la única foto que se recorta
      // a cuadrado en un lugar donde el widget puede ver la foto de forma confiable —
      // ver la nota larga junto al campo "Encuadre" de la galería (images[]) sobre por
      // qué esa lista usa un selector de posición en vez de este mismo control.
      (function () {
        var h = window.h, createClass = window.createClass;

        function parseFocus(value) {
          var parts = (value || "50% 50%").split(" ");
          var x = parseInt(parts[0], 10);
          var y = parseInt(parts[1], 10);
          return { x: isNaN(x) ? 50 : Math.max(0, Math.min(100, x)), y: isNaN(y) ? 50 : Math.max(0, Math.min(100, y)) };
        }

        // Mismo look que los botones nativos de Decap junto al campo Imagen ("Elige una
        // imagen diferente", etc.) — para que "Editar foto" se sienta parte del mismo
        // grupo de acciones y no un widget aparte. Color y forma tomados a ojo del CSS
        // real de esos botones (Emotion, sin clase estable que targetear desde afuera).
        var EDIT_BUTTON_STYLE = {
          display: "inline-block",
          background: "#eaf1fb",
          color: "#3271d9",
          border: "none",
          borderRadius: "3px",
          padding: ".5rem .9rem",
          fontSize: ".84rem",
          fontWeight: "500",
          cursor: "pointer",
          marginTop: ".6rem",
        };

        var FocusPointControl = createClass({
          getInitialState: function () {
            return { naturalW: null, naturalH: null, editing: false };
          },
          handleImgLoad: function (e) {
            this.setState({ naturalW: e.target.naturalWidth, naturalH: e.target.naturalHeight });
          },
          handleClick: function (e) {
            var rect = e.currentTarget.getBoundingClientRect();
            var x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
            var y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
            x = Math.max(0, Math.min(100, x));
            y = Math.max(0, Math.min(100, y));
            this.props.onChange(x + "% " + y + "%");
          },
          toggleEditing: function () {
            this.setState({ editing: !this.state.editing });
          },
          render: function () {
            var focus = parseFocus(this.props.value);
            var coverSrc = null;
            try {
              coverSrc = this.props.entry.getIn(["data", "cover", "src"]);
            } catch (e) {}
            var imgUrl = null;
            if (coverSrc) {
              try {
                var asset = this.props.getAsset(coverSrc);
                imgUrl = asset ? asset.toString() : null;
              } catch (e) {}
            }
            if (!imgUrl) {
              return h(
                "div",
                { style: { padding: ".9rem", background: "#f0efe9", color: "#84817a", fontSize: ".82rem", border: "1px solid #e7e4dd" } },
                "Sube la foto de Portada primero (campo de arriba) — el botón para editar el encuadre aparece acá una vez que la elijas."
              );
            }
            if (!this.state.editing) {
              return h(
                "button",
                { type: "button", style: EDIT_BUTTON_STYLE, onClick: this.toggleEditing },
                "Editar foto (encuadre y zoom)"
              );
            }
            // El recuadro punteado que muestra el recorte final: un cuadrado cuyo lado
            // es el lado más corto de la foto mostrada, centrado en el punto marcado y
            // sujeto para no salirse del borde. Solo se puede calcular una vez que la
            // imagen cargó y se conoce su proporción real.
            var frameStyle = null;
            if (this.state.naturalW && this.state.naturalH) {
              var isLandscape = this.state.naturalW >= this.state.naturalH;
              var sidePct = isLandscape ? (this.state.naturalH / this.state.naturalW) * 100 : 100;
              var sidePctOther = isLandscape ? 100 : (this.state.naturalW / this.state.naturalH) * 100;
              var halfW = (isLandscape ? sidePct : sidePctOther) / 2;
              var halfH = (isLandscape ? sidePctOther : sidePct) / 2;
              // en landscape el cuadrado se desliza en X según el punto marcado; en
              // portrait se desliza en Y. En el otro eje siempre cubre el 100%.
              var frameLeft = isLandscape ? Math.max(0, Math.min(100 - sidePct, focus.x - sidePct / 2)) : 0;
              var frameTop = isLandscape ? 0 : Math.max(0, Math.min(100 - sidePct, focus.y - sidePct / 2));
              frameStyle = {
                position: "absolute",
                left: frameLeft + "%",
                top: frameTop + "%",
                width: (isLandscape ? sidePct : 100) + "%",
                height: (isLandscape ? 100 : sidePct) + "%",
                border: "2px dashed #98433e",
                boxShadow: "0 0 0 1000px rgba(0,0,0,.35)",
                pointerEvents: "none",
                boxSizing: "border-box",
              };
            }
            return h(
              "div",
              {},
              h(
                "button",
                { type: "button", style: Object.assign({}, EDIT_BUTTON_STYLE, { marginTop: 0, marginBottom: ".6rem" }), onClick: this.toggleEditing },
                "Listo — cerrar editor de foto"
              ),
              h(
                "div",
                { style: { position: "relative", display: "inline-block", maxWidth: "100%", overflow: "hidden", cursor: "crosshair" }, onClick: this.handleClick },
                h("img", {
                  src: imgUrl,
                  onLoad: this.handleImgLoad,
                  style: { display: "block", maxWidth: "100%", maxHeight: "360px", pointerEvents: "none" },
                }),
                frameStyle && h("div", { style: frameStyle }),
                h("div", {
                  style: {
                    position: "absolute",
                    left: focus.x + "%",
                    top: focus.y + "%",
                    width: "18px",
                    height: "18px",
                    marginLeft: "-9px",
                    marginTop: "-9px",
                    borderRadius: "50%",
                    border: "2px solid #fff",
                    boxShadow: "0 0 0 2px #98433e, 0 1px 4px rgba(0,0,0,.5)",
                    pointerEvents: "none",
                  },
                })
              ),
              h(
                "div",
                { style: { fontSize: ".78rem", color: "#84817a", marginTop: ".5rem", maxWidth: "420px" } },
                "Toca o haz clic sobre la foto para mover el punto. Lo que queda DENTRO del recuadro punteado es lo que se ve en la portada y en las grillas cuadradas — lo de afuera se recorta. El campo \"Zoom de la miniatura\" (abajo) acerca la toma sobre este mismo punto."
              ),
              h(
                "div",
                { style: { fontSize: ".78rem", color: "#84817a", marginTop: ".25rem" } },
                "Si acabas de cambiar la foto de portada, guarda, sal de esta ficha y vuelve a entrar — así el encuadre carga la foto nueva."
              )
            );
          },
        });
        CMS.registerWidget("focuspoint", FocusPointControl);
      })();

      // quería un requisito de peso/tamaño adecuado para una galería de fotógrafo, no

      function zoomField() {
        return {
          label: "Zoom de la miniatura",
          name: "zoom",
          widget: "select",
          required: false,
          default: "1",
          options: [
            { label: "Sin zoom (foto normal)", value: "1" },

            { label: "Mucho más cerca", value: "2" },
          ],
          hint: "Para cuando el \"Encuadre\" no alcanza porque la foto fue tomada de lejos (cuerpo completo) y el sujeto se ve chico contra el fondo. Acerca la miniatura sobre el punto elegido en \"Encuadre\" — la foto completa (al abrirla en grande) no cambia.",
        };
      }

      // A pedido de Ramón (3-sep-2026): volteo horizontal de la miniatura, para cuando
      // la persona queda "mirando hacia afuera" de la grilla en vez de hacia el
      // contenido. Mismo criterio que Zoom: solo afecta la miniatura recortada, la
      // foto que abre el visor a tamaño completo sigue siendo la original sin voltear.
      function flipField() {
        return {
          label: "Voltear en espejo (horizontal)",
          name: "flip",
          widget: "boolean",
          required: false,
          default: false,
          hint: "Solo cambia cómo se ve en la miniatura (home y grillas) — la foto original, y la que se abre en grande, no se voltea.",
        };
